name: Nightly CI Dashboard Publication

on:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * *"

jobs:
  make_dashboard:
    name: Prepare Dashboard
    runs-on: ubuntu-latest
    outputs:
      artdaq_lcov_html_report_path: ${{ steps.set_paths.outputs.artdaq_lcov_html_report_path }}
      otsdaq_lcov_html_report_path: ${{ steps.set_paths.outputs.otsdaq_lcov_html_report_path }}
      artdaq_doxy_html_path: ${{ steps.set_paths.outputs.artdaq_doxy_html_path }}
      otsdaq_doxy_html_path: ${{ steps.set_paths.outputs.otsdaq_doxy_html_path }}
    defaults:
      run: 
        shell: bash
    env:
      GH_TOKEN: ${{ secrets.BOT_CI_ISSUES }}
    steps:
    - name: Set paths to artifacts
      id: set_paths
      run : |
        echo "artdaq_lcov_html_report_path=artdaq_lcov_report" >> "$GITHUB_OUTPUT"
        echo "otsdaq_lcov_html_report_path=otsdaq_lcov_report" >> "$GITHUB_OUTPUT"
        echo "artdaq_doxy_html_path=artdaq_doxygen" >> "$GITHUB_OUTPUT"
        echo "otsdaq_doxy_html_path=otsdaq_doxygen" >> "$GITHUB_OUTPUT"
    - name: Get workflow run IDs
      id: run_ids
      run: |
        artdaq_doxy_id=$(gh run list --repo art-daq/artdaq \
                              --workflow "artdaq-develop-cpp-ci.yml" \
                              --limit 1 \
                              --json databaseId --jq '.[0].databaseId')
        otsdaq_doxy_id=$(gh run list --repo art-daq/otsdaq \
                                   --workflow "otsdaq-develop-cpp-ci.yml" \
                                   --limit 1 \
                                   --json databaseId --jq '.[0].databaseId')
        artdaq_lcov_id=$(gh run list --repo art-daq/.github \
                              --workflow "Create artdaq LCOV coverage report" \
                              --limit 1 \
                              --json databaseId --jq '.[0].databaseId')
        otsdaq_lcov_id=$(gh run list --repo art-daq/.github \
                              --workflow "Create otsdaq LCOV coverage report" \
                              --limit 1 \
                              --json databaseId --jq '.[0].databaseId')
        echo "artdaq_doxy_id=$artdaq_doxy_id" | tee -a "$GITHUB_OUTPUT"
        echo "otsdaq_doxy_id=$otsdaq_doxy_id" | tee -a "$GITHUB_OUTPUT"
        echo "artdaq_lcov_id=$artdaq_lcov_id" | tee -a "$GITHUB_OUTPUT"
        echo "otsdaq_lcov_id=$otsdaq_lcov_id" | tee -a "$GITHUB_OUTPUT"
        
    - name: Fetch artdaq Doxygen docs
      uses: actions/download-artifact@v4
      with:
        name: doxygen
        github-token: ${{ secrets.BOT_CI_ISSUES }}
        repository: art-daq/artdaq
        path: ${{ steps.set_paths.outputs.artdaq_doxy_html_path }} 
        run-id: ${{ steps.run_ids.outputs.artdaq_doxy_id }}

    - name: Fetch otsdaq Doxygen docs
      uses: actions/download-artifact@v4
      with:
        name: doxygen
        github-token: ${{ secrets.BOT_CI_ISSUES }}
        repository: art-daq/otsdaq
        run-id: ${{ steps.run_ids.outputs.otsdaq_doxy_id }}
        path: ${{ steps.set_paths.outputs.otsdaq_doxy_html_path }} 

    - name: Download artdaq lcov html report
      id: artdaq_download_lcov
      uses: actions/download-artifact@v4
      with:
        name: artdaq_code_coverage
        github-token: ${{ secrets.BOT_CI_ISSUES }}
        path: ${{ steps.set_paths.outputs.artdaq_lcov_html_report_path }}
        run-id: ${{ steps.run_ids.outputs.artdaq_lcov_id }} 
        repository: "art-daq/.github"
    - name: Download otsdaq lcov html report
      id: otsdaq_download_lcov
      uses: actions/download-artifact@v4
      with:
        name: otsdaq_code_coverage
        github-token: ${{ secrets.BOT_CI_ISSUES }}
        path: ${{ steps.set_paths.outputs.otsdaq_lcov_html_report_path }}
        run-id: ${{ steps.run_ids.outputs.otsdaq_lcov_id }} 
        repository: "art-daq/.github"
    - name: Checkout art-daq.github.io
      uses: actions/checkout@v4
      with:
        path: ci-dashboard
    - name: Copy artifacts and generate dashboard
      run: |
        mkdir -p ci-dashboard/scripts/github-ci/site
        cp -r ${{ steps.set_paths.outputs.artdaq_lcov_html_report_path }} ci-dashboard/scripts/github-ci/site/artdaq_code_coverage
        cp -r ${{ steps.set_paths.outputs.otsdaq_lcov_html_report_path }} ci-dashboard/scripts/github-ci/site/otsdaq_code_coverage
        cp -r ${{ steps.set_paths.outputs.artdaq_doxy_html_path }} ci-dashboard/scripts/github-ci/site/artdaq_doxygen
        cp -r ${{ steps.set_paths.outputs.otsdaq_doxy_html_path }} ci-dashboard/scripts/github-ci/site/otsdaq_doxygen
        cd ci-dashboard/scripts/github-ci/
        ./collect-ci-metrics.sh
        echo "CI Summary JSON:"
        cat ci_summary.json
        python generate_ci_site.py --json_input ci_summary.json
    - name: Upload pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ${{ github.workspace }}/ci-dashboard/scripts/github-ci/site
    - name: Remove test directory
      run: |
        rm -rf ci-dashboard/

  deploy_to_github_pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: make_dashboard
    permissions:
        contents: read
        pages: write
        id-token: write
    environment:
        name: github-pages
        url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Configure GitHub Pages
      uses: actions/configure-pages@v5
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

